<!DOCTYPE html>
<html lang="zh-CN">

    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>BUAA GPA Studio</title>
        <link rel="icon" type="image/svg+xml" href="static/icon.svg">
        <link rel="stylesheet" href="static/vendor/fontawesome/css/fontawesome.min.css">
        <link rel="stylesheet" href="static/vendor/fontawesome/css/solid.min.css">
        <script>
            window.MathJax = {
                tex: {
                    inlineMath: [
                        ['$', '$']
                    ],
                    displayMath: [
                        ['$$', '$$']
                    ]
                },
                svg: {
                    fontCache: 'local'
                },
                options: {
                    enableMenu: false
                }
            };
        </script>
        <script defer src="static/vendor/mathjax/tex-svg-full.js"></script>
        <style>
            :root {
                --theme: #3498db;
                --theme-dark: #2980b9;
                --success: #27ae60;
                --error: #e74c3c;
                --warning: #f39c12;
                --radius: 12px;
                --shadow: 0 8px 30px rgba(0, 0, 0, 0.08);
                --bg: linear-gradient(135deg, #f5f7fa 0%, #e4edf5 100%);
            }

            * {
                box-sizing: border-box;
                margin: 0;
                padding: 0;
                font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft YaHei", Roboto, sans-serif;
            }

            body {
                height: 100vh;
                height: 100dvh;
                background: var(--bg);
                padding: 16px 16px;
                display: flex;
                flex-direction: column;
                align-items: center;
                overflow-x: hidden;
                overflow-y: auto;
            }

            /* ── 主容器 ── */
            .app {
                width: 100%;
                max-width: 960px;
                height: 100%;
                min-height: 0;
                display: flex;
                flex-direction: column;
                flex: none;
            }

            /* ── 卡片 ── */
            .card {
                background: rgba(255, 255, 255, 0.88);
                backdrop-filter: blur(12px);
                border-radius: 16px;
                box-shadow: var(--shadow);
                border: 1px solid rgba(255, 255, 255, 0.6);
                padding: 12px 24px;
                margin-bottom: 18px;
            }

            .workspace-card {
                flex: 1;
                min-height: 0;
                margin-bottom: 0;
                padding-bottom: 8px;
                display: flex;
                flex-direction: column;
            }

            /* ── 头部 ── */
            .header {
                display: flex;
                justify-content: space-between;
                align-items: center;
            }

            .header h1 {
                font-size: 26px;
                background: linear-gradient(90deg, var(--theme), var(--theme-dark));
                -webkit-background-clip: text;
                -webkit-text-fill-color: transparent;
            }

            .header .subtitle {
                font-size: 13px;
                color: #7f8c8d;
                margin-top: 4px;
            }

            .ini-status {
                display: flex;
                align-items: center;
                gap: 7px;
                font-size: 13px;
                padding: 6px 14px;
                border-radius: 20px;
                background: #ecf0f1;
                color: #7f8c8d;
                transition: all 0.3s;
                cursor: pointer;
                white-space: nowrap;
                min-width: 0;
                max-width: 100%;
            }

            #ini-status-text {
                min-width: 0;
                overflow: hidden;
                text-overflow: ellipsis;
            }

            .ini-status.linked {
                background: rgba(39, 174, 96, 0.12);
                color: var(--success);
            }

            .ini-status .dot {
                width: 8px;
                height: 8px;
                border-radius: 50%;
                background: #bdc3c7;
                transition: 0.3s;
            }

            .ini-status.linked .dot {
                background: var(--success);
                box-shadow: 0 0 6px rgba(39, 174, 96, 0.5);
            }

            .header-actions {
                display: flex;
                flex-direction: column;
                align-items: flex-end;
                gap: 7px;
                min-width: 0;
            }

            .desktop-download {
                border: 1px solid #b7d8f1;
                border-radius: 8px;
                background: #eaf2fb;
                color: var(--theme-dark);
                padding: 5px 12px;
                font-size: 12px;
                cursor: pointer;
            }

            .desktop-download:hover {
                background: #dcecf9;
            }

            .toolbar button .fas,
            .desktop-download .fas {
                margin-right: 5px;
            }

            /* ── 公式弹窗 ── */
            .formula-body {
                font-size: 14px;
                line-height: 2;
                color: #444;
            }

            .formula-body .formula-row {
                margin: 8px 0;
                padding: 10px 16px;
                background: #f7f9fc;
                border-radius: 8px;
            }

            .formula-body .five-table {
                width: 100%;
                border-collapse: collapse;
                margin-top: 8px;
                font-size: 13px;
                table-layout: fixed;
            }

            .formula-body .five-table th,
            .formula-body .five-table td {
                border: 1px solid #e0e7ff;
                padding: 6px 12px;
                text-align: center;
            }

            .formula-body .five-table th {
                background: #eaf2fb;
                color: var(--theme-dark);
            }

            /* ── 工具栏 ── */
            .toolbar {
                display: flex;
                align-items: center;
                gap: 35px;
                margin-bottom: 8px;
            }

            .toolbar-actions {
                flex: 1;
                min-width: 0;
                display: grid;
                grid-template-columns: repeat(7, minmax(0, 1fr));
                gap: 8px;
            }

            .toolbar button {
                min-width: 0;
                padding: 8px 6px;
                border: none;
                border-radius: var(--radius);
                font-size: 13px;
                font-weight: 500;
                cursor: pointer;
                transition: all 0.2s;
                background: #fff;
                color: #555;
                border: 1px solid #e0e7ff;
                white-space: nowrap;
            }

            .toolbar button:hover {
                border-color: var(--theme);
                color: var(--theme);
                transform: translateY(-1px);
            }

            .toolbar button:disabled {
                opacity: 0.4;
                cursor: not-allowed;
                transform: none;
            }

            .toolbar button.primary {
                background: linear-gradient(90deg, var(--theme), var(--theme-dark));
                color: #fff;
                border: none;
            }

            .toolbar button.primary:hover {
                opacity: 0.9;
                color: #fff;
            }

            .toolbar button.danger,
            .del-row-btn {
                background: var(--error);
                border-color: var(--error);
                color: #fff;
            }

            .toolbar button.danger:hover,
            .del-row-btn:hover {
                background: #c0392b;
                border-color: #c0392b;
                color: #fff;
            }

            .toolbar button.formula-trigger {
                flex: none;
                padding-inline: 14px;
                background: #eaf2fb;
                border-color: #b7d8f1;
                color: var(--theme-dark);
                font-weight: 600;
            }

            .toolbar button.formula-trigger:hover {
                background: #dcecf9;
                color: #17608f;
            }

            /* ── Tab栏 ── */
            .tab-bar {
                display: flex;
                gap: 4px;
                margin-bottom: 0;
                border-bottom: 2px solid #e8ecf1;
                padding-bottom: 0;
                flex: none;
            }

            .tab-btn {
                height: 42px;
                padding: 3px 12px 0;
                border: none;
                background: transparent;
                cursor: pointer;
                font-size: 14px;
                color: #7f8c8d;
                border-bottom: 3px solid transparent;
                margin-bottom: -2px;
                transition: all 0.2s;
                flex: 0 0 calc((100% - 16px) / 5);
                min-width: 0;
                text-align: center;
                white-space: nowrap;
                overflow: hidden;
                text-overflow: ellipsis;
                display: flex;
                align-items: center;
                justify-content: center;
            }

            .tab-bar.menu-mode .tab-btn {
                flex: 1 1 0;
                cursor: default;
            }

            .tab-bar.menu-mode::after {
                content: '';
                flex: 0 0 52px;
            }

            .tab-bar.menu-mode .tab-btn:hover {
                color: var(--theme);
            }

            .tab-btn:hover {
                color: var(--theme);
            }

            .tab-btn.active {
                color: var(--theme);
                border-bottom-color: var(--theme);
                font-weight: 600;
            }

            .tab-label {
                min-width: 0;
                overflow: hidden;
                white-space: nowrap;
                text-overflow: ellipsis;
            }

            .hamburger-btn {
                height: 42px;
                padding: 3px 0 0;
                border: none;
                background: transparent;
                cursor: pointer;
                font-size: 18px;
                color: #555;
                margin-bottom: -2px;
                border-bottom: 3px solid transparent;
                flex: 0 0 52px;
                display: flex;
                align-items: center;
                justify-content: center;
            }

            .hamburger-btn:hover {
                color: var(--theme);
            }

            .tab-dropdown {
                position: fixed;
                background: #fff;
                border-radius: 8px;
                box-shadow: 0 4px 20px rgba(0, 0, 0, 0.12);
                z-index: 100;
                min-width: 180px;
                max-width: calc(100vw - 16px);
                max-height: 50dvh;
                overflow: auto;
            }

            .tab-dropdown .dd-item {
                padding: 10px 16px;
                width: 100%;
                border: 0;
                background: #fff;
                color: #555;
                text-align: left;
                cursor: pointer;
                font-size: 13px;
                display: block;
                white-space: nowrap;
                line-height: 1.4;
                overflow: hidden;
                text-overflow: ellipsis;
            }

            .tab-dropdown .dd-item:hover {
                background: #f0f6fc;
            }

            .tab-dropdown .dd-item.current {
                color: var(--theme);
                font-weight: 600;
            }

            /* ── Tab内容 ── */
            .tab-content {
                background: #fff;
                border: 1px solid #e8ecf1;
                border-top: none;
                border-radius: 0 0 var(--radius) var(--radius);
                padding: 8px 16px 12px 16px;
                flex: 1;
                min-height: 0;
                overflow: auto;
            }

            .course-table {
                min-width: 720px;
                min-height: 100%;
                display: flex;
                flex-direction: column;
            }

            .course-list {
                flex: 1;
                display: flex;
                flex-direction: column;
            }

            .empty-courses {
                flex: 1;
                display: grid;
                place-items: center;
                min-height: 72px;
                color: #95a5a6;
                font-size: 14px;
            }

            .tab-content::-webkit-scrollbar {
                width: 6px;
            }

            .tab-content::-webkit-scrollbar-thumb {
                background: #d0d7de;
                border-radius: 3px;
            }

            /* ── 行表头 ── */
            .row-header,
            .course-row {
                display: grid;
                grid-template-columns: 30px minmax(200px, 1fr) 70px 92px 201px 30px;
                gap: 8px;
                align-items: center;
                padding: 8px 4px;
            }

            .row-header {
                font-size: 12px;
                color: #95a5a6;
                font-weight: 600;
                border-bottom: 1px solid #eee;
                padding: 8px 20px 12px;
                margin: 0 -16px;
                position: sticky;
                top: 0;
                z-index: 2;
                background: #fff;
                box-shadow: 0 -8px 0 #fff, 0 4px 0 #fff;
            }

            .row-header>div {
                text-align: center;
            }

            .course-row {
                border-bottom: 1px solid #f5f5f5;
                transition: background 0.15s;
            }

            .course-row:hover {
                background: #fafbfc;
            }

            .course-row .num {
                text-align: center;
                color: #95a5a6;
                font-size: 13px;
                font-weight: 600;
            }

            .course-row input[type="text"],
            .course-row input[type="number"] {
                width: 100%;
                padding: 7px 10px;
                border: 1px solid #e0e7ff;
                border-radius: 8px;
                font-size: 13px;
                background: #fafbfc;
                transition: 0.2s;
            }

            .course-row input:focus {
                outline: none;
                border-color: var(--theme);
                background: #fff;
                box-shadow: 0 0 0 3px rgba(52, 152, 219, 0.12);
            }

            .course-row input.invalid {
                border-color: var(--error);
                background: #fdf0ef;
            }

            .type-group {
                display: flex;
                gap: 4px;
            }

            .type-group label {
                display: flex;
                align-items: center;
                gap: 3px;
                font-size: 12px;
                cursor: pointer;
                padding: 4px;
                border-radius: 6px;
                border: 1px solid #e0e7ff;
                transition: 0.2s;
                color: #7f8c8d;
                white-space: nowrap;
                flex: none;
            }

            .type-group label:hover {
                border-color: var(--theme);
            }

            .type-group label:has(input:checked) {
                border-color: var(--theme);
                background: #eaf2fb;
                color: var(--theme);
                font-weight: 600;
            }

            .type-group label:has(input:focus-visible) {
                outline: 2px solid var(--theme-dark);
                outline-offset: 1px;
            }

            .type-group input[type="radio"] {
                accent-color: var(--theme);
                width: 14px;
                height: 14px;
                flex: none;
            }

            .del-row-btn {
                width: 30px;
                height: 30px;
                border: none;
                border-radius: 6px;
                cursor: pointer;
                font-size: 16px;
                transition: 0.2s;
                display: flex;
                align-items: center;
                justify-content: center;
            }

            .del-row-btn:hover {
                transform: none;
            }

            .add-row-btn {
                width: 100%;
                padding: 10px;
                margin-top: auto;
                border: 2px dashed #d0d7de;
                background: transparent;
                color: #95a5a6;
                border-radius: 8px;
                cursor: pointer;
                font-size: 13px;
                transition: 0.2s;
            }

            .add-row-btn:hover {
                border-color: var(--theme);
                color: var(--theme);
                background: #f0f6fc;
            }

            /* ── 结果区 ── */
            .results-panel {
                flex: none;
                margin-top: 10px;
            }

            .result-heading {
                display: flex;
                align-items: center;
                justify-content: space-between;
                gap: 12px;
            }

            .result-heading h3 {
                font-size: 15px;
                color: #2c3e50;
                white-space: nowrap;
            }

            .result-settings {
                display: flex;
                align-items: center;
                gap: 16px;
                font-size: 12px;
                color: #607080;
            }

            .autosave-control,
            .precision-control {
                display: inline-flex;
                align-items: center;
                gap: 7px;
                white-space: nowrap;
            }

            .autosave-control {
                cursor: pointer;
                position: relative;
            }

            .autosave-control input {
                position: absolute;
                opacity: 0;
                width: 1px;
                height: 1px;
            }

            .switch-track {
                width: 34px;
                height: 19px;
                border-radius: 12px;
                background: #bdc8d0;
                position: relative;
                transition: background 0.2s;
            }

            .switch-track::after {
                content: '';
                position: absolute;
                top: 2px;
                left: 2px;
                width: 15px;
                height: 15px;
                border-radius: 50%;
                background: #fff;
                transition: transform 0.2s;
            }

            .autosave-control input:checked+.switch-track {
                background: var(--success);
            }

            .autosave-control input:checked+.switch-track::after {
                transform: translateX(15px);
            }

            .autosave-control input:focus-visible+.switch-track {
                outline: 2px solid var(--theme-dark);
                outline-offset: 2px;
            }

            .autosave-control:has(input:disabled) {
                opacity: 0.5;
                cursor: not-allowed;
            }

            .formula-label-compact {
                display: none;
            }

            .precision-control select {
                padding: 3px 5px;
                border: 1px solid #d3dee8;
                border-radius: 5px;
                background: #fff;
                color: #34495e;
            }

            .result-grid {
                display: grid;
                grid-template-columns: repeat(5, minmax(135px, 1fr));
                gap: 12px;
                margin-top: 12px;
                overflow-x: auto;
            }

            .result-item {
                text-align: center;
                padding: 14px 8px;
                background: #f7f9fc;
                border-radius: 10px;
            }

            .result-item .r-label {
                font-size: 12px;
                color: #95a5a6;
                display: block;
                margin-bottom: 6px;
            }

            .result-item .r-value {
                font-size: 22px;
                font-weight: 700;
                color: var(--theme-dark);
                font-variant-numeric: tabular-nums;
                overflow-wrap: anywhere;
            }

            /* ── 状态栏 ── */
            .status-bar {
                font-size: 12px;
                color: #95a5a6;
                padding: 8px 4px 0;
                text-align: center;
                flex: none;
            }

            /* ── 模态框 ── */
            .modal-overlay {
                position: fixed;
                inset: 0;
                background: rgba(0, 0, 0, 0.4);
                backdrop-filter: blur(4px);
                display: flex;
                align-items: center;
                justify-content: center;
                z-index: 1000;
                animation: fadeIn 0.2s;
                padding: 16px;
            }

            @keyframes fadeIn {
                from {
                    opacity: 0;
                }

                to {
                    opacity: 1;
                }
            }

            .modal {
                background: #fff;
                border-radius: 16px;
                padding: 28px;
                min-width: 320px;
                max-width: 420px;
                box-shadow: 0 20px 60px rgba(0, 0, 0, 0.2);
                animation: slideUp 0.25s;
                width: min(100%, 420px);
            }

            .formula-modal {
                width: min(100%, 720px);
                min-width: 0;
                max-width: 720px;
                max-height: calc(100dvh - 32px);
                overflow-y: auto;
                border: 0;
                scrollbar-width: none;
            }

            .formula-modal::-webkit-scrollbar {
                display: none;
            }

            /* 自定义公式右键菜单 */
            .math-copy-menu {
                position: fixed;
                z-index: 2147483647;
                min-width: 120px;
                padding: 5px;
                background: #fff;
                border: 1px solid #e0e7ff;
                border-radius: 8px;
                box-shadow: 0 6px 24px rgba(0, 0, 0, 0.18);
            }

            .math-copy-menu button {
                display: block;
                width: 100%;
                padding: 9px 12px;
                border: none;
                border-radius: 5px;
                background: transparent;
                color: #34495e;
                text-align: center;
                font-size: 13px;
                cursor: pointer;
            }

            .math-copy-menu button:hover,
            .math-copy-menu button:focus-visible {
                background: #eaf2fb;
                outline: none;
            }

            .formula-modal-header {
                display: flex;
                align-items: center;
                justify-content: space-between;
                gap: 12px;
                margin-bottom: 12px;
            }

            .formula-modal-header h3 {
                margin: 0;
            }

            .formula-close {
                border: 0;
                border-radius: 7px;
                padding: 6px 12px;
                background: #eaf2fb;
                color: var(--theme-dark);
                cursor: pointer;
            }

            @keyframes slideUp {
                from {
                    transform: translateY(20px);
                    opacity: 0;
                }

                to {
                    transform: translateY(0);
                    opacity: 1;
                }
            }

            .modal h3 {
                font-size: 17px;
                color: #2c3e50;
            }

            .modal p {
                font-size: 14px;
                color: #555;
                line-height: 1.6;
                margin-bottom: 20px;
            }

            .modal input {
                width: 100%;
                padding: 10px 14px;
                border: 1px solid #e0e7ff;
                border-radius: 8px;
                font-size: 14px;
                margin-bottom: 20px;
            }

            .modal input:focus {
                outline: none;
                border-color: var(--theme);
                box-shadow: 0 0 0 3px rgba(52, 152, 219, 0.12);
            }

            .modal-buttons {
                display: flex;
                gap: 10px;
                justify-content: center;
            }

            .modal-buttons button {
                padding: 9px 22px;
                border: none;
                border-radius: 8px;
                font-size: 14px;
                font-weight: 500;
                cursor: pointer;
                transition: 0.2s;
            }

            .modal-buttons .btn-cancel {
                background: #ecf0f1;
                color: #555;
            }

            .modal-buttons .btn-cancel:hover {
                background: #dfe6e9;
            }

            .modal-buttons .btn-ok {
                background: linear-gradient(90deg, var(--theme), var(--theme-dark));
                color: #fff;
            }

            .modal-buttons .btn-ok:hover {
                opacity: 0.9;
            }

            .modal-buttons .btn-danger {
                background: var(--error);
                color: #fff;
            }

            .modal-buttons .btn-danger:hover {
                opacity: 0.9;
            }

            .app-footer {
                max-width: 960px;
                width: 100%;
                text-align: center;
                font-size: 0.85rem;
                color: #607589;
                padding-top: 16px;
                line-height: 1.5;
            }

            .app-footer a {
                color: #286f9f;
                text-decoration: none;
                margin: 0 6px;
            }

            .app-footer a:hover {
                text-decoration: underline;
            }

            /* ── 响应式 ── */
            @media (max-width: 800px) {
                .toolbar {
                    display: grid;
                    grid-template-columns: repeat(4, minmax(0, 1fr));
                    gap: 6px;
                }

                .toolbar-actions {
                    display: contents;
                }

                .toolbar button.formula-trigger {
                    padding-inline: 6px;
                }
            }

            @media (max-width: 720px) {
                .result-grid {
                    display: flex;
                    flex-wrap: wrap;
                    justify-content: center;
                    gap: 6px;
                    margin-top: 6px;
                }

                .empty-courses,
                .add-row-btn {
                    position: sticky;
                    left: 0;
                    align-self: flex-start;
                    width: min(280px, calc(100vw - 80px));
                    margin-left: max(0px, calc((100vw - 80px - 280px) / 2));
                }

                .add-row-btn {
                    margin-top: auto;
                }

                .header {
                    flex-direction: column;
                    gap: 10px;
                    align-items: center;
                    text-align: center;
                }

                .header-actions {
                    align-items: center;
                    width: 100%;
                    flex-direction: row;
                    justify-content: center;
                }

                .result-item {
                    padding: 6px 6px;
                    flex: 0 0 calc((100% - 12px) / 3);
                    min-width: 0;
                }

                .result-item .r-value {
                    font-size: 17px;
                }
            }

            @media (max-width: 600px) {
                .tab-content {
                    padding: 8px;
                    overflow-x: hidden;
                }

                .course-table {
                    min-width: 0;
                    width: 100%;
                }

                .course-row {
                    grid-template-columns: 58px 70px minmax(0, 1fr);

    <body>

        <div class="app">
            <!-- 头部 -->
            <div class="card">
                <div class="header">
                    <div>
                        <h1>BUAA GPA Studio</h1>
                        <div class="subtitle">北航成绩与绩点计算工具</div>
                    </div>
                    <div class="header-actions">
                        <div id="ini-status" class="ini-status" title="点击加载INI文件">
                            <span class="dot"></span><span id="ini-status-text">未关联本地 INI 文件</span>
                        </div>
                        <button class="desktop-download" type="button" onclick="downloadDesktopRelease()" title="从 GitHub Release 下载 Windows 桌面版">
                            <i class="fas fa-download" aria-hidden="true"></i>下载 Windows 桌面版
                        </button>
                    </div>
                </div>
            </div>

            <!-- 公式只在工具栏弹窗中展示 -->
            <template id="formula-template">
                <div class="formula-body">
                    <div class="formula-row">
                        记 $P$ 为有效的百分制课程集合，$F$ 为有效的五级制课程集合，$G$ 为每门有效的百分制或五级制课程的绩点，$C$ 为对应课程学分，$X$ 为每门有效的百分制课程成绩。
                    </div>
                    <div class="formula-row">
                        <strong>平均学分绩点 (GPA)：</strong><br>
                        $$GPA = \frac{\sum_{i\in P\cup F} G_i \times C_i}{\sum_{i\in P\cup F} C_i}$$
                    </div>
                    <div class="formula-row">
                        <strong>加权平均分：</strong><br>
                        $$X_w = \frac{\sum_{i\in P} X_i \times C_i}{\sum_{i\in P} C_i}$$
                    </div>
                    <div class="formula-row">
                        <strong>算术平均分：</strong>
                        $$X_a = \frac{1}{|P|}\sum_{i\in P} X_i$$
                    </div>
                    <div class="formula-row">
                        <strong>百分制课程绩点：</strong><br>
                        $$G = \begin{cases} 4 - \dfrac{3 \times (100-X)^2}{1600}, & X \geq 60 \\[6pt] 0, & X < 60 \end{cases}$$
                        <strong>五级制课程绩点：</strong>
                            <table class="five-table">
                                <tr>
                                    <th>成绩</th>
                                    <th>优秀</th>
                                    <th>良好</th>
                                    <th>中等</th>
                                    <th>及格</th>
                                    <th>不及格</th>
                                </tr>
                                <tr>
                                    <td>绩点</td>
                                    <td>4.0</td>
                                    <td>3.5</td>
                                    <td>2.8</td>
                                    <td>1.7</td>
                                    <td>0</td>
                                </tr>
                            </table>
                    </div>
                    <div class="formula-row" style="background:#fef9e7;">
                        <strong>两级制课程 (通过/不通过)：</strong>有效成绩计入总学分和有效课程数，不计入 GPA。
                    </div>
                </div>
            </template>

            <!-- 工具栏 + Tab + 内容 + 结果 -->
            <div class="card workspace-card">
                <div class="toolbar">
                    <div class="toolbar-actions">
                        <button onclick="saveINI()" title="保存到当前配置文件 (Ctrl+S)" aria-keyshortcuts="Control+S"><i class="fas fa-floppy-disk" aria-hidden="true"></i>保存</button>
                        <button onclick="openINI()" title="加载另一份 INI 配置 (Ctrl+O)" aria-keyshortcuts="Control+O"><i class="fas fa-folder-open" aria-hidden="true"></i>加载</button>
                        <button class="primary" onclick="addSet()" title="新建成绩组"><i class="fas fa-plus" aria-hidden="true"></i>新建组</button>
                        <button class="danger" onclick="deleteSet()" title="删除当前成绩组"><i class="fas fa-trash" aria-hidden="true"></i>删除组</button>
                        <button onclick="renameSet()" title="重命名当前成绩组 (F2)" aria-keyshortcuts="F2"><i class="fas fa-pen" aria-hidden="true"></i>重命名</button>
                        <button id="btn-undo" onclick="undo()" title="撤销 (Ctrl+Z)" aria-keyshortcuts="Control+Z" disabled><i class="fas fa-rotate-left" aria-hidden="true"></i>撤销</button>
                        <button id="btn-redo" onclick="redo()" title="重做 (Ctrl+Y 或 Ctrl+Shift+Z)" aria-keyshortcuts="Control+Y Control+Shift+Z" disabled><i class="fas fa-rotate-right" aria-hidden="true"></i>重做</button>
                    </div>
                    <button class="formula-trigger" onclick="showFormula()" title="查看计算方法"><span>$f(x)$</span><span class="formula-label-full">&nbsp;计算公式</span><span class="formula-label-compact">&nbsp;公式</span></button>
                </div>

                <div id="tab-bar" class="tab-bar"></div>
                <div id="tab-content" class="tab-content"></div>

                <div class="results-panel">
                    <div class="result-heading">
                        <h3><i class="fas fa-chart-simple" aria-hidden="true"></i>&nbsp;&nbsp;计算结果</h3>
                        <div class="result-settings">
                            <label class="autosave-control" title="未关联 INI 时禁用">
                                <span class="setting-label">自动保存</span>
                                <input id="autosave-toggle" type="checkbox" onchange="setAutosave(this.checked)">
                                <span class="switch-track" aria-hidden="true"></span>
                            </label>
                            <label class="precision-control" for="precision-select"><span class="setting-label">小数位数</span>
                                <select id="precision-select" onchange="setPrecision(this.value)"></select>
                            </label>
                        </div>
                    </div>
                    <div class="result-grid">
                        <div class="result-item"><span class="r-label">算术平均分</span><span class="r-value" id="r-avg">—</span></div>
                        <div class="result-item"><span class="r-label">加权平均分</span><span class="r-value" id="r-weighted">—</span></div>
                        <div class="result-item"><span class="r-label">GPA</span><span class="r-value" id="r-gpa">—</span></div>
                        <div class="result-item"><span class="r-label">总学分</span><span class="r-value" id="r-credit">—</span></div>
                        <div class="result-item"><span class="r-label" title="三种评分制中成绩有效且学分大于 0 的课程">有效课程</span><span class="r-value" id="r-count">—</span></div>
                    </div>
                </div>

                <div class="status-bar" id="status-bar" role="status" aria-live="polite">就绪</div>
            </div>

            <footer class="app-footer">
                <div style="line-height: 1.8">
                    <a href="https://github.com/theFool-wn/BUAA-GPA-Studio" target="_blank">GitHub</a> |
                    <a href="https://wangnan.net" target="_blank">HomePage</a> |
                    <a href="mailto:me@wangnan.net">Email</a>
                </div>

            </footer>
        </div>

        <input type="file" id="file-input" accept=".ini" style="display:none">

        <script>
            const TAB_MAX = 5; // 超过此数量显示汉堡菜单
            const DESKTOP_RELEASE = {
                repository: 'theFool-wn/BUAA-GPA-Studio',
                tag: 'v1.0.0',
                asset: 'BUAA GPA Studio.exe'
            };

            const state = {
                sets: [],
                currentSet: 0,
                precision: 5,
                autosave: false,
                undoStack: [],
                redoStack: [],
                undoDepth: 50,
                iniFileName: null,
                fileHandle: null,
                rebuilding: false
            };

            function deepCloneSets(sets) {
                return JSON.parse(JSON.stringify(sets));
            }

            function pushUndo() {
                state.undoStack.push(deepCloneSets(state.sets));
                if (state.undoStack.length > state.undoDepth) state.undoStack.shift();
                state.redoStack = [];
                updateToolbar();
            }

            function undo() {
                if (state.undoStack.length === 0) return;
                state.redoStack.push(deepCloneSets(state.sets));
                state.sets = state.undoStack.pop();
                if (state.currentSet >= state.sets.length) state.currentSet = 0;
                renderAll();
                scheduleAutosave();
                setStatus('已撤销');
            }

            function redo() {
                if (state.redoStack.length === 0) return;
                state.undoStack.push(deepCloneSets(state.sets));
                state.sets = state.redoStack.pop();
                if (state.currentSet >= state.sets.length) state.currentSet = 0;
                renderAll();
                scheduleAutosave();
                setStatus('已重做');
            }

            function updateToolbar() {
                document.getElementById('btn-undo').disabled = state.undoStack.length === 0;
                document.getElementById('btn-redo').disabled = state.redoStack.length === 0;
            }

            /* 计算核心 (与 C 端逻辑一致) */

            const FIVE_LEVEL_MAP = {
                '优秀': 4.0,
                'excellent': 4.0,
                'a+': 4.0,
                'a': 4.0,
                '良好': 3.5,
                'good': 3.5,
                'b+': 3.5,
                'b': 3.5,
                '中等': 2.8,
                'medium': 2.8,
                'c+': 2.8,
                'c': 2.8,
                '及格': 1.7,
                'pass': 1.7,
                'passing': 1.7,
                'd': 1.7,
                '不及格': 0,
                'fail': 0,
                'failing': 0,
                'f': 0,
                '不合格': 0
            };

            function normalize(s) {
                return (s || '').trim().toLowerCase();
            }

            function isValidFiveLevel(str) {
                return Object.prototype.hasOwnProperty.call(FIVE_LEVEL_MAP, normalize(str));
            }

            function isPass(str) {
                const s = normalize(str);
                return s === '通过' || s === 'pass' || s === 'p' || s === '合格';
            }

            function isValidPassFail(str) {
                const s = normalize(str);
                return isPass(s) || s === '不通过' || s === 'fail' || s === 'f' || s === '不合格';
            }

            function percentGpa(x) {
                if (x < 60) return 0;
                if (x > 100) x = 100;
                return 4 - 3 * Math.pow(100 - x, 2) / 1600;
            }

            function percentValue(score) {
                const text = String(score).trim();
                if (!/^(?:\d+(?:\.\d*)?|\.\d+)(?:[eE][+-]?\d+)?$/.test(text)) return -1;
                const value = Number(text);
                return Number.isFinite(value) && value >= 0 && value <= 100 ? value : -1;
            }

            function courseToNumber(c) {
                return c.type === 'percent' ? percentValue(c.score) : -1;
            }

            function courseToGpa(c) {
                if (c.type === 'percent') {
                    const v = percentValue(c.score);
                    return v < 0 ? -1 : percentGpa(v);
                }
                if (c.type === 'fivelevel') {
                    if (!isValidFiveLevel(c.score)) return -1;
                    return FIVE_LEVEL_MAP[normalize(c.score)];
                }
                return -1;
            }

            function calcSet(set) {
                let sumScore = 0,
                    sumWeight = 0,
                    percentCredit = 0,
                    percentCount = 0,
                    sumGpa = 0,
                    gpaCredit = 0,
                    gpaCount = 0,
                    sumCredit = 0,
                    valid = 0;
                for (const c of set.courses) {
                    if (!Number.isFinite(c.credit) || c.credit <= 0) continue;
                    if (c.type === 'percent') {
                        const num = courseToNumber(c);
                        if (num < 0) continue;
                        sumScore += num;
                        sumWeight += num * c.credit;
                        percentCredit += c.credit;
                        percentCount++;
                        sumGpa += percentGpa(num) * c.credit;
                        gpaCredit += c.credit;
                        gpaCount++;
                    } else if (c.type === 'fivelevel') {
                        const gpa = courseToGpa(c);
                        if (gpa < 0) continue;
                        sumGpa += gpa * c.credit;
                        gpaCredit += c.credit;
                        gpaCount++;
                    } else if (c.type === 'passfail') {
                        if (!isValidPassFail(c.score)) continue;
                    } else continue;
                    sumCredit += c.credit;
                    valid++;
                }
                return {
                    hasData: valid > 0,
                    percentCount,
                    gpaCount,
                    avg: percentCount > 0 ? sumScore / percentCount : 0,
                    weighted: percentCredit > 0 ? sumWeight / percentCredit : 0,
                    gpa: gpaCredit > 0 ? sumGpa / gpaCredit : 0,
                    credit: sumCredit,
                    count: valid
                };
            }

            function refreshResults() {
                const r = calcSet(state.sets[state.currentSet]);
                const p = state.precision;
                const fmt = (v, available) => available ? v.toFixed(p) : '—';
                document.getElementById('r-avg').textContent = fmt(r.avg, r.percentCount > 0);
                document.getElementById('r-weighted').textContent = fmt(r.weighted, r.percentCount > 0);
                document.getElementById('r-gpa').textContent = fmt(r.gpa, r.gpaCount > 0);
                document.getElementById('r-credit').textContent = r.hasData ? r.credit.toFixed(2) : '—';
                document.getElementById('r-count').textContent = r.hasData ? r.count : '—';
            }

            function setAutosave(enabled) {
                if (!state.fileHandle) {
                    state.autosave = false;
                    updateSettingsControls();
                    return;
                }
                state.autosave = Boolean(enabled);
                if (state.autosave) scheduleAutosave();
                else clearTimeout(autosaveTimer);
                if (saveLocalDraft()) {
                    setStatus(state.autosave ? '已开启 INI 自动保存' : '已关闭 INI 自动保存');
                } else {
                    setStatus('浏览器本地草稿保存失败，请手动保存 INI');
                }
            }

            function setPrecision(value) {
                const precision = Number(value);
                if (!Number.isInteger(precision) || precision < 0 || precision > 15) return;
                state.precision = precision;
                refreshResults();
                scheduleAutosave();
                setStatus(`结果显示 ${precision} 位小数`);
            }

            function addSet() {
                if (state.sets.length >= 1000) {
                    setStatus('最多 1000 个成绩组');
                    return;
                }
                showInput('新建成绩组', '请输入组名称：', '', (name) => {
                    pushUndo();
                    state.sets.push({
                        name: name || `成绩组 ${state.sets.length + 1}`,
                        courses: []
                    });
                    state.currentSet = state.sets.length - 1;
                    renderAll();
                    scheduleAutosave();
                    setStatus('已新建成绩组');
                });
            }

            function deleteSet() {
                if (state.sets.length <= 1) {
                    setStatus('至少保留一个成绩组');
                    return;
                }
                const name = state.sets[state.currentSet].name;
                showConfirm('删除成绩组', `确定要删除「${name}」吗？`, () => {
                    pushUndo();
                    state.sets.splice(state.currentSet, 1);
                    if (state.currentSet >= state.sets.length) state.currentSet = state.sets.length - 1;
                    renderAll();
                    scheduleAutosave();
                    setStatus('已删除成绩组');
                });
            }

            function renameSet() {
                const old = state.sets[state.currentSet].name;
                showInput('重命名', '请输入新的组名称：', old, (name) => {
                    if (!name || name === old) return;
                    pushUndo();
                    state.sets[state.currentSet].name = name;
                    renderTabBar();
                    scheduleAutosave();
                    setStatus(`已重命名为「${name}」`);
                });
            }

            function addCourse() {
                if (state.sets[state.currentSet].courses.length >= 10000) {
                    setStatus('每组最多 10000 门课程');
                    return;
                }
                pushUndo();
                state.sets[state.currentSet].courses.push({
                    name: '',
                    credit: 1,
                    score: '',
                    type: 'percent'
                });
                renderTabContent();
                const panel = document.getElementById('tab-content');
                panel.scrollTop = panel.scrollHeight;
                refreshResults();
                updateToolbar();
                scheduleAutosave();
            }

            function deleteCourse(idx) {
                showConfirm('删除课程', '确定要删除这门课程吗？', () => {
                    pushUndo();
                    state.sets[state.currentSet].courses.splice(idx, 1);
                    renderTabContent();
                    refreshResults();
                    updateToolbar();
                    scheduleAutosave();
                    setStatus('已删除课程');
                });
            }

            function updateCourse(idx, field, value) {
                if (state.rebuilding) return;
                const c = state.sets[state.currentSet].courses[idx];
                if (field === 'credit') {
                    const v = parseFloat(value);
                    if (value !== '' && (!Number.isFinite(v) || v < 0)) return;
                    c.credit = value === '' ? 0 : v;
                } else if (field === 'score') {
                    c.score = value;
                } else if (field === 'name') {
                    if (/[|\r\n]/.test(value)) return;
                    c.name = value;
                } else if (field === 'type') {
                    if (c.type === value) return;
                    c.type = value;
                    c.score = ''; // 切换类型清空成绩
                }
                if (field === 'type') renderTabContent();
                refreshResults();
                scheduleAutosave();
            }

            function renderAll() {
                renderTabBar();
                renderTabContent();
                refreshResults();
                updateToolbar();
                updateSettingsControls();
            }

            function updateSettingsControls() {
                const autosaveToggle = document.getElementById('autosave-toggle');
                autosaveToggle.disabled = !state.fileHandle;
                autosaveToggle.checked = Boolean(state.fileHandle && state.autosave);
                document.getElementById('precision-select').value = String(state.precision);
            }

            function renderTabBar() {
                document.querySelector('.tab-dropdown')?.closeMenu();
                const bar = document.getElementById('tab-bar');
                bar.innerHTML = '';
                const n = state.sets.length;
                bar.classList.toggle('menu-mode', n > TAB_MAX);

                if (n <= TAB_MAX) {
                    state.sets.forEach((s, i) => {
                        const btn = document.createElement('button');
                        btn.className = 'tab-btn' + (i === state.currentSet ? ' active' : '');
                        const label = document.createElement('span');
                        label.className = 'tab-label';
                        label.textContent = s.name;
                        btn.appendChild(label);
                        btn.title = s.name;
                        btn.onclick = () => {
                            state.currentSet = i;
                            renderAll();
                        };
                        bar.appendChild(btn);
                    });
                } else {
                    // 汉堡模式：左侧菜单，右侧整行显示当前组。
                    const cur = state.sets[state.currentSet];
                    const ham = document.createElement('button');
                    ham.className = 'hamburger-btn';
                    ham.type = 'button';
                    ham.innerHTML = '<i class="fas fa-bars" aria-hidden="true"></i>';

                    ham.onclick = showHamburgerMenu;
                    bar.appendChild(ham);

                    const btn = document.createElement('div');
                    btn.className = 'tab-btn active';
                    const label = document.createElement('span');
                    label.className = 'tab-label';
                    label.textContent = cur.name;

            function showHamburgerMenu() {
                const old = document.querySelector('.tab-dropdown');
                if (old) {
                    old.closeMenu();
                    return;
                }

                const dd = document.createElement('div');
                dd.className = 'tab-dropdown';
                const close = () => {
                    dd.remove();
                    document.removeEventListener('click', onOutside);
                    document.removeEventListener('keydown', onEscape);
                };
                const onOutside = (event) => {
                    if (!dd.contains(event.target) &&
                        !document.getElementById('tab-bar').contains(event.target)) close();
                };
                const onEscape = (event) => {
                    if (event.key === 'Escape') close();
                };
                dd.closeMenu = close;
                state.sets.forEach((s, i) => {
                    const item = document.createElement('button');
                    item.type = 'button';
                    item.className = 'dd-item' + (i === state.currentSet ? ' current' : '');
                    item.textContent = s.name;
                    item.title = s.name;
                    item.onclick = () => {
                        state.currentSet = i;
                        close();
                        renderAll();
                    };
                    dd.appendChild(item);
                });
                document.body.appendChild(dd);

                // 定位到按钮下方
                const rect = document.querySelector('.hamburger-btn').getBoundingClientRect();
                const width = Math.min(260, window.innerWidth - 16);
                dd.style.width = width + 'px';
                dd.style.left = Math.max(8, Math.min(rect.left, window.innerWidth - width - 8)) + 'px';
                dd.style.top = (rect.bottom + 4) + 'px';
                dd.style.maxHeight = Math.min(360, Math.max(80, window.innerHeight - rect.bottom - 12)) + 'px';

                // 点击外部关闭
                setTimeout(() => {
                    if (dd.isConnected) {
                        document.addEventListener('click', onOutside);
                        document.addEventListener('keydown', onEscape);
                    }
                }, 0);
            }

            function registerEditHistory(input) {
                let captured = false;
                input.addEventListener('focus', () => {
                    captured = false;
                });
                return () => {
                    if (!captured) {
                        pushUndo();
                        captured = true;
                    }
                };
            }

                    creditInput.addEventListener('blur', () => {

                    row.appendChild(creditInput);

                    scoreInput.type = 'text';

                    scoreInput.title = c.type === 'percent' ? '0 - 100' :
                        (c.type === 'fivelevel' ? '优秀/良好/中等/及格/不及格' : '通过/不通过');
                    scoreInput.maxLength = 63;
                    if (c.type === 'percent' && c.score !== '' && percentValue(c.score) < 0) {
                        scoreInput.classList.add('invalid');

                    if (c.type === 'passfail' && c.score !== '' && !isValidPassFail(c.score)) {
                        scoreInput.classList.add('invalid');
                    }
                    const beginScoreEdit = registerEditHistory(scoreInput);
                    scoreInput.addEventListener('input', (e) => {
                        if (new TextEncoder().encode(e.target.value).length >= 64 ||
                            /[|\r\n]/.test(e.target.value)) {
                            e.target.value = c.score;
                            setStatus('成绩最多 63 字节，不能包含 | 或换行');
                            return;
                        }
                        if (c.type === 'percent') {
                            const v = e.target.value;
                            if (v !== '' && !/^\d*\.?\d*$/.test(v)) {
                                e.target.value = c.score;
                                setStatus('百分制成绩只能是 0 - 100 的数字');

                            }
                            if (v !== '' && parseFloat(v) > 100) {
                                e.target.value = '100';
                                setStatus('成绩不能超过 100');

                        if (e.target.value !== c.score) {

                            updateCourse(idx, 'score', e.target.value);

                        e.target.classList.toggle('invalid', c.score !== '' &&

                    row.appendChild(scoreInput);

                    // 类型单选
                    const typeGroup = document.createElement('div');
                    typeGroup.className = 'type-group';
                    [

                    ].forEach(([val, label]) => {

                        lbl.title = label === '百分制' ? '百分制成绩：0 - 100' :

                            '两级制成绩：通过/不通过';
                        const radio = document.createElement('input');
                        radio.type = 'radio';
                        radio.name = `type-${idx}`;
                        radio.value = val;
                        radio.checked = c.type === val;

                            pushUndo();

                    row.appendChild(typeGroup);

                    delBtn.innerHTML = '<i class="fas fa-xmark" aria-hidden="true"></i>';
                    delBtn.title = '删除该课程';

                    delBtn.onclick = () => deleteCourse(idx);
                    row.appendChild(delBtn);

                    list.appendChild(row);

                if (set.courses.length === 0) {

                    empty.textContent = '当前无课程';
