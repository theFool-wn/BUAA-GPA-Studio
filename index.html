                addBtn.onclick = addCourse;
                list.appendChild(addBtn);

                container.scrollTop = scrollTop;
                container.scrollLeft = scrollLeft;

                state.rebuilding = false;
            }

            /* INI 读写 (与 C 端格式一致) */

            function parseINI(text) {
                const sets = [];
                let section = '',
                    current = null,
                    precision = 5,
                    autosave = true;
                let expectedSets = null,
                    expectedCourses = null,
                    generalSeen = false;
                const creditPattern = /^(?:\d+(?:\.\d{0,2})?|\.\d{1,2})$/;
                const encoder = new TextEncoder();
                const positiveIndex = (value, maximum) => {
                    if (!/^\+?\d+$/.test(value.trimStart())) return null;
                    const number = Number(value);
                    return Number.isInteger(number) && number >= 1 && number <= maximum
                        ? number : null;
                };
                const lines = text.split('\n');
                for (const raw of lines) {
                    if (encoder.encode(raw).length > 1022) throw new Error('INI 行过长');
                    const line = raw.trim();
                    if (!line || line.startsWith(';') || line.startsWith('#')) continue;
                    if (line.startsWith('[')) {
                        if (current && expectedCourses !== null &&
                            current.courses.length !== expectedCourses) throw new Error('课程数量不符');
                        if (line === '[general]') {
                            section = 'general';
                            current = null;
                            generalSeen = true;
                        } else if (line.startsWith('[set') && line.endsWith(']')) {
                            if (positiveIndex(line.slice(4, -1), 1000) !== sets.length + 1)
                                throw new Error('成绩组编号错误');
                            current = {
                                name: '',
                                courses: []
                            };
                            sets.push(current);
                            expectedCourses = null;
                            section = 'set';
                        } else {
                            throw new Error('成绩组编号错误');
                        }
                        continue;
                    }
                    const eq = line.indexOf('=');
                    if (eq < 0) throw new Error('缺少等号');
                    const key = line.slice(0, eq).trim();
                    const value = line.slice(eq + 1).trim();
                    if (section === 'general') {
                        if (key === 'precision') {
                            precision = value === '0' ? 0 : positiveIndex(value, 15);
                            if (precision === null) throw new Error('精度无效');
                        } else if (key === 'sets') {
                            expectedSets = positiveIndex(value, 1000);
                            if (expectedSets === null) throw new Error('成绩组数量无效');
                        } else if (key === 'autosave') {
                            if (value !== 'true' && value !== 'false') throw new Error('自动保存设置无效');
                            autosave = value === 'true';
                        }
                    } else if (section === 'set') {
                        if (key === 'name') {
                            if (new TextEncoder().encode(value).length >= 256)
                                throw new Error('组名称太长');
                            current.name = value;
                        } else if (key === 'courses') {
                            expectedCourses = value === '0' ? 0 : positiveIndex(value, 10000);
                            if (expectedCourses === null) throw new Error('课程数量无效');
                        } else if (key.startsWith('c')) {
                            const index = positiveIndex(key.slice(1), 10000);
                            if (index !== current.courses.length + 1)
                                throw new Error('课程编号错误');
                            const parts = value.split('|').map(part => part.trim());
                            if (parts.length !== 4 || !creditPattern.test(parts[1]))
                                throw new Error('课程格式错误');
                            const credit = Number(parts[1]);
                            if (!Number.isFinite(credit) || credit < 0) throw new Error('学分无效');
                            const [name, , score, type] = parts;
                            if (new TextEncoder().encode(name).length >= 128 ||
                                new TextEncoder().encode(score).length >= 64)
                                throw new Error('课程字段太长');
                            if (!['percent', 'fivelevel', 'passfail'].includes(type))
                                throw new Error('评分制无效');
                            current.courses.push({
                                name,
                                credit,
                                score,
                                type
                            });
                        }
                    } else throw new Error('缺少节标题');
                }
                if (current && expectedCourses !== null &&
                    current.courses.length !== expectedCourses) throw new Error('课程数量不符');
                if (!generalSeen || !sets.length ||
                    (expectedSets !== null && sets.length !== expectedSets))
                    throw new Error('成绩组数量不符');
                for (const set of sets)
                    if (!set.name) set.name = '未命名';
                return {
                    sets,
                    precision,
                    autosave
                };
            }

            function generateINI() {
                const creditFormatter = new Intl.NumberFormat('en-US', {
                    useGrouping: false,
                    minimumFractionDigits: 2,
                    maximumFractionDigits: 2
                });
                let out = '\uFEFF; BUAA GPA Studio 配置文件\n';
                out += '; 课程格式：课程名|学分|成绩|类型；学分为 0 的课程不计入统计\n\n';
                out += '[general]\nversion=1.0.0\nsets=' + state.sets.length +
                    '\nprecision=' + state.precision +
                    '\nautosave=' + (state.autosave ? 'true' : 'false') + '\n\n';
                state.sets.forEach((set, i) => {
                    out += '[set' + (i + 1) + ']\nname=' + (set.name || '未命名') +
                        '\ncourses=' + set.courses.length + '\n';
                    set.courses.forEach((course, j) => {
                        const credit = creditFormatter.format(course.credit);
                        if (!Number.isFinite(course.credit) || course.credit < 0 ||
                            Object.is(course.credit, -0) || Number(credit) !== course.credit)
                            throw new Error('学分无法按两位小数保存');
                        out += 'c' + (j + 1) + '=' + course.name + '|' +
                            credit + '|' + course.score + '|' +
                            course.type + '\n';
                    });
                    out += '\n';
                });
                return out;
            }

            let autosaveTimer = null;

            function saveLocalDraft() {
                try {
                    localStorage.setItem('buaa-gpa-studio', generateINI());
                    return true;
                } catch (error) {
                    return false;
                }
            }

            async function writeLinkedFile() {
                const writable = await state.fileHandle.createWritable();
                await writable.write(generateINI());
                await writable.close();
            }

            function scheduleAutosave() {
                clearTimeout(autosaveTimer);
                autosaveTimer = setTimeout(async () => {
                    if (!saveLocalDraft()) {
                        setStatus(state.fileHandle ? '浏览器本地草稿保存失败，请手动保存 INI' :
                            '浏览器本地草稿保存失败，请手动下载 INI');
                    }
                    if (state.fileHandle && state.autosave) {
                        try {
                            await writeLinkedFile();
                        } catch (error) {
                            setStatus('INI 自动保存失败，请手动保存');
                        }
                    }
                }, 500);
            }

            async function saveINI() {
                clearTimeout(autosaveTimer);
                saveLocalDraft();
                if (state.fileHandle) {
                    try {
                        await writeLinkedFile();
                        setStatus('已保存到 ' + state.iniFileName);
                        return;
                    } catch (error) {
                        setStatus('写回失败，请检查文件权限');
                        return;
                    }
                }
                const blob = new Blob([generateINI()], {
                    type: 'text/plain;charset=utf-8'
                });
                const url = URL.createObjectURL(blob);
                const link = document.createElement('a');
                link.href = url;
                link.download = state.iniFileName || 'config.ini';
                document.body.appendChild(link);
                link.click();
                link.remove();
                setTimeout(() => URL.revokeObjectURL(url), 1000);
                setStatus('已下载 ' + link.download);
            }

            function loadFromText(text, fileName, fileHandle = null) {
                const result = parseINI(text);
                clearTimeout(autosaveTimer);
                state.sets = result.sets;
                state.precision = result.precision;
                state.autosave = Boolean(fileHandle && result.autosave);
                state.currentSet = 0;
                state.undoStack = [];
                state.redoStack = [];
                state.iniFileName = fileName;
                state.fileHandle = fileHandle;
                updateIniStatus();
                renderAll();
                setStatus(saveLocalDraft() ? '已加载 ' + fileName :
                    '已加载 ' + fileName + '，但浏览器无法保存本地副本');
            }

            async function openINI() {
                if (window.showOpenFilePicker) {
                    try {
                        const [handle] = await window.showOpenFilePicker({
                            types: [{
                                description: 'INI 配置文件',
                                accept: {
                                    'text/plain': ['.ini']
                                }
                            }]
                        });
                        const file = await handle.getFile();
                        loadFromText(await file.text(), file.name, handle);
                    } catch (error) {
                        if (error.name !== 'AbortError') setStatus('加载失败：文件格式或权限错误');
                    }
                } else document.getElementById('file-input').click();
            }

            document.getElementById('file-input').addEventListener('change', async (event) => {
                const file = event.target.files[0];
                if (!file) return;
                try {
                    loadFromText(await file.text(), file.name);
                } catch (error) {
                    setStatus('加载失败：文件格式错误');
                }
                event.target.value = '';
            });

            function updateIniStatus() {
                const el = document.getElementById('ini-status');
                const label = document.getElementById('ini-status-text');
                el.classList.toggle('linked', Boolean(state.fileHandle));
                if (state.fileHandle) {
                    label.textContent = '已关联：' + state.iniFileName;
                    el.title = '重新选择';
                } else if (state.iniFileName) {
                    label.textContent = '已加载：' + state.iniFileName;
                    el.title = '保存时会下载文件；点击可重新选择';
                } else {
                    label.textContent = '未关联本地 INI 文件';
                    el.title = '点击加载 INI 配置文件';
                }
            }

            document.getElementById('ini-status').addEventListener('click', openINI);

            async function downloadDesktopRelease() {
                const {
                    repository,
                    tag,
                    asset
                } = DESKTOP_RELEASE;
                try {
                    const response = await fetch(`https://api.github.com/repos/${repository}/releases/tags/${encodeURIComponent(tag)}`, {
                        headers: {
                            Accept: 'application/vnd.github+json'
                        }
                    });
                    if (response.status === 404) {
                        setStatus(`Windows 桌面版 ${tag} 尚未发布`);
                        return;
                    }
                    if (!response.ok) throw new Error('Release 查询失败');
                    const release = await response.json();
                    const githubAssetName = asset.replace(/\s+/g, '.');
                    const file = release.assets?.find((item) =>
                        item.name === asset || item.name === githubAssetName);
                    if (!file) {
                        setStatus(`版本 ${tag} 尚未上传 ${asset}`);
                        return;
                    }
                    const url = new URL(file.browser_download_url);
                    if (url.protocol !== 'https:' || url.hostname !== 'github.com') {
                        throw new Error('下载地址无效');
                    }
                    const link = document.createElement('a');
                    link.href = url.href;
                    link.rel = 'noopener';
                    document.body.appendChild(link);
                    link.click();
                    link.remove();
                    setStatus(`正在下载 ${asset}`);
                } catch (error) {
                    setStatus('无法获取桌面版下载地址，请稍后重试');
                }
            }

            /* ─────────────────── 模态框 ─────────────────── */
            function showFormula() {
                if (document.querySelector('.formula-overlay')) return;
                const overlay = document.createElement('div');
                overlay.className = 'modal-overlay formula-overlay';
                const panel = document.createElement('section');
                panel.className = 'modal formula-modal';
                panel.setAttribute('role', 'dialog');
                panel.setAttribute('aria-modal', 'true');
                panel.setAttribute('aria-label', '计算方法');
                panel.innerHTML = '<div class="formula-modal-header"><h3>计算方法</h3><button class="formula-close" type="button">关闭</button></div>';
                panel.appendChild(document.getElementById('formula-template').content.cloneNode(true));
                overlay.appendChild(panel);
                const previousFocus = document.activeElement;
                const app = document.querySelector('.app');
                const previousInert = app.inert;
                app.inert = true;
                document.body.appendChild(overlay);
                const close = () => {
                    if (!overlay.isConnected) return;
                    closeMathCopyMenu();
                    window.MathJax?.typesetClear?.([panel]);
                    overlay.remove();
                    app.inert = previousInert;
                    document.removeEventListener('keydown', onKeydown);
                    previousFocus?.focus();
                };
                const onKeydown = (event) => {
                    if (event.key === 'Escape' &&
                        !event.target.closest?.('.CtxtMenu_Menu, .CtxtMenu_Info')) close();
                };
                panel.querySelector('.formula-close').onclick = close;
                overlay.addEventListener('click', (event) => {
                    if (event.target === overlay) close();
                });
                document.addEventListener('keydown', onKeydown);
                panel.querySelector('.formula-close').focus();
                const mathJax = window.MathJax;
                if (mathJax?.startup?.promise) {
                    mathJax.startup.promise.then(() => {
                        if (overlay.isConnected) return mathJax.typesetPromise([panel]);
                    }).catch(() => setStatus('计算公式排版失败，请检查网络连接'));
                }
            }

            function showConfirm(title, msg, onOk) {
                const overlay = document.createElement('div');
                overlay.className = 'modal-overlay';
                overlay.innerHTML = `
                    <div class="modal">
                        <h3>${escapeHtml(title)}</h3>
                        <p>${escapeHtml(msg)}</p>
                        <div class="modal-buttons">
                            <button class="btn-cancel">取消</button>
                            <button class="btn-danger">确定</button>
                        </div>
                    </div>`;
                document.body.appendChild(overlay);
                overlay.querySelector('.btn-cancel').onclick = () => overlay.remove();
                overlay.querySelector('.btn-danger').onclick = () => {
                    overlay.remove();
                    onOk();
                };
                overlay.addEventListener('click', (e) => {
                    if (e.target === overlay) overlay.remove();
                });
            }

            function showInput(title, prompt, initial, onOk) {
                const overlay = document.createElement('div');
                overlay.className = 'modal-overlay';
                overlay.innerHTML = `
                    <div class="modal">
                        <h3>${escapeHtml(title)}</h3>
                        <p>${escapeHtml(prompt)}</p>
                        <input type="text">
                        <div class="modal-buttons">
                            <button class="btn-cancel">取消</button>
                            <button class="btn-ok">确定</button>
                        </div>
                    </div>`;
                document.body.appendChild(overlay);
                const input = overlay.querySelector('input');
                input.value = initial || '';
                input.focus();
                input.select();
                const submit = () => {
                    const v = input.value.trim();
                    if (/[=\r\n]/.test(v) || new TextEncoder().encode(v).length >= 256) {
                        setStatus('组名不能包含等号或换行，最多 255 字节');
                        return;
                    }
                    overlay.remove();
                    onOk(v);
                };
                overlay.querySelector('.btn-ok').onclick = submit;
                overlay.querySelector('.btn-cancel').onclick = () => overlay.remove();
                input.addEventListener('keydown', (e) => {
                    if (e.key === 'Enter') submit();
                    if (e.key === 'Escape') overlay.remove();
                });
                overlay.addEventListener('click', (e) => {
                    if (e.target === overlay) overlay.remove();
                });
            }

            function escapeHtml(str) {
                const div = document.createElement('div');
                div.textContent = str;
                return div.innerHTML;
            }

            function setStatus(msg) {
                document.getElementById('status-bar').textContent = msg;
            }

            /* 快捷键 */
            document.addEventListener('keydown', (e) => {
                if (document.querySelector('.modal-overlay, dialog[open]')) return;
                if (e.ctrlKey || e.metaKey) {
                    const key = e.key.toLowerCase();
                    if (key === 'z' && !e.shiftKey) {
                        e.preventDefault();
                        undo();
                    } else if (key === 'y' || (key === 'z' && e.shiftKey)) {
                        e.preventDefault();
                        redo();
                    } else if (key === 's') {
                        e.preventDefault();
                        saveINI();
                    } else if (key === 'o') {
                        e.preventDefault();
                        openINI();
                    }
                } else if (e.key === 'F2' && !e.altKey) {
                    e.preventDefault();
                    renameSet();
                }
            });

            /* 数学公式右键复制 */

            let activeMathCopyMenu = null;

            function closeMathCopyMenu() {
                activeMathCopyMenu?.remove();
                activeMathCopyMenu = null;
            }

            async function copyMathText(text) {
                if (navigator.clipboard?.writeText) {
                    await navigator.clipboard.writeText(text);
                    return;
                }

                // 兼容不支持 Clipboard API 的环境
                const input = document.createElement('textarea');
                input.value = text;
                input.style.position = 'fixed';
                input.style.opacity = '0';
                document.body.appendChild(input);
                input.select();

                const success = document.execCommand('copy');
                input.remove();

                if (!success) throw new Error('复制失败');
            }

            /* 复制 SVG 矢量图片 */
            async function copySvgImage(svgCode) {
                if (!navigator.clipboard?.write ||
                    !window.ClipboardItem ||
                    !ClipboardItem.supports?.('image/svg+xml')) {
                    throw new Error('浏览器不支持复制 SVG 图片');
                }

                const blob = new Blob([svgCode], {
                    type: 'image/svg+xml'
                });

                await navigator.clipboard.write([
                    new ClipboardItem({
                        'image/svg+xml': blob
                    })
                ]);
            }

            /* 复制 PNG 位图 */
            async function copyPngImage(svgCode, width, height) {
                if (!navigator.clipboard?.write || !window.ClipboardItem) {
                    throw new Error('浏览器不支持复制图片');
                }

                const scale = 20;

                const pngPromise = new Promise((resolve, reject) => {
                    const blob = new Blob([svgCode], {
                        type: 'image/svg+xml'
                    });
                    const url = URL.createObjectURL(blob);
                    const img = new Image();

                    img.onload = () => {
                        try {
                            const canvas = document.createElement('canvas');
                            canvas.width = Math.ceil(width * scale);
                            canvas.height = Math.ceil(height * scale);

                            const ctx = canvas.getContext('2d');
                            if (!ctx) throw new Error('无法创建 Canvas');

                            ctx.scale(scale, scale);
                            ctx.drawImage(img, 0, 0, width, height);

                            canvas.toBlob((png) => {
                                if (png) resolve(png);
                                else reject(new Error('PNG 转换失败'));
                            }, 'image/png');
                        } catch (error) {
                            reject(error);
                        } finally {
                            URL.revokeObjectURL(url);
                        }
                    };

                    img.onerror = () => {
                        URL.revokeObjectURL(url);
                        reject(new Error('SVG 图片加载失败'));
                    };

                    img.src = url;
                });

                await navigator.clipboard.write([
                    new ClipboardItem({
                        'image/png': pngPromise
                    })
                ]);
            }

            document.addEventListener('contextmenu', (event) => {
                const container = event.target.closest?.('mjx-container');
                if (!container) return;

                const mathJax = window.MathJax;
                const mathList = mathJax?.startup?.document?.math;
                if (!mathList) return;

                // 找到鼠标所指公式对应的 MathJax 数学对象
                const mathItem = Array.from(mathList).find(
                    item => item.typesetRoot === container
                );
                if (!mathItem) return;

                event.preventDefault();
                event.stopImmediatePropagation();

                closeMathCopyMenu();

                // 获取 LaTeX 源码
                const texCode = mathItem.math;

                // 获取当前公式的 SVG
                const svg = container.querySelector('svg');
                let svgCode = null;
                let svgWidth = 0;
                let svgHeight = 0;

                if (svg) {
                    const clone = svg.cloneNode(true);
                    const rect = svg.getBoundingClientRect();

                    svgWidth = Math.max(1, rect.width);
                    svgHeight = Math.max(1, rect.height);

                    clone.setAttribute('xmlns', 'http://www.w3.org/2000/svg');
                    clone.setAttribute('xmlns:xlink', 'http://www.w3.org/1999/xlink');
                    clone.setAttribute('width', `${svgWidth}px`);
                    clone.setAttribute('height', `${svgHeight}px`);

                    // 使公式独立于网页中的颜色和样式
                    clone.style.color = '#000000';

                    const group = clone.querySelector('g');
                    if (group) {
                        group.setAttribute('fill', '#000000');
                        group.setAttribute('stroke', '#000000');
                    }

                    // 嵌入 MathJax SVG 所需的样式
                    const defs = clone.querySelector('defs') ||
                        clone.insertBefore(
                            document.createElementNS(
                                'http://www.w3.org/2000/svg', 'defs'
                            ),
                            clone.firstChild
                        );

                    const style = document.createElementNS(
                        'http://www.w3.org/2000/svg', 'style'
                    );

                    style.textContent = `
                        svg a { fill: blue; stroke: blue; }
                        [data-mml-node="merror"] > g { fill: red; stroke: red; }
                        [data-mml-node="merror"] > rect[data-background] {
                            fill: yellow; stroke: none;
                        }
                        [data-frame], [data-line] {
                            stroke-width: 70px; fill: none;
                        }
                        .mjx-dashed { stroke-dasharray: 140; }
                        .mjx-dotted {
                            stroke-linecap: round;
                            stroke-dasharray: 0,140;
                        }
                        use[data-c] { stroke-width: 3px; }
                    `;

                    defs.appendChild(style);

                    svgCode = new XMLSerializer().serializeToString(clone);
                }

                const menu = document.createElement('div');
                menu.className = 'math-copy-menu';
                menu.setAttribute('role', 'menu');

                function addOption(label, value) {
                    if (value == null) return;

                    const button = document.createElement('button');
                    button.type = 'button';
                    button.textContent = label;
                    button.setAttribute('role', 'menuitem');

                    button.onclick = async () => {
                        try {
                            await copyMathText(value);
                            setStatus(`已${label}`);
                        } catch (error) {
                            setStatus('复制失败，请检查浏览器剪贴板权限');
                        }
                        closeMathCopyMenu();
                    };

                    menu.appendChild(button);
                }

                function addImageOption(label, copyFn) {
                    const button = document.createElement('button');
                    button.type = 'button';
                    button.textContent = label;
                    button.setAttribute('role', 'menuitem');

                    button.onclick = async () => {
                        try {
                            await copyFn();
                            setStatus(`已${label}`);
                        } catch (error) {
                            console.error(error);
                            setStatus(`复制失败：${error.message}`);
                        }
                        closeMathCopyMenu();
                    };

                    menu.appendChild(button);
                }

                addOption('复制 TeX 源码', texCode);
                addOption('复制 SVG 源码', svgCode);
                if (svgCode) {
                    addImageOption('复制 SVG 图片',
                        () => copySvgImage(svgCode));
                    addImageOption('复制 PNG 图片',
                        () => copyPngImage(svgCode, svgWidth, svgHeight));
                }

                // 放在弹窗遮罩层内，但不放在可滚动的 panel 中
                const host = document.querySelector('.formula-overlay') ||
                    document.body;

                host.appendChild(menu);
                activeMathCopyMenu = menu;

                // 防止菜单超出屏幕
                const width = menu.offsetWidth;
                const height = menu.offsetHeight;

                menu.style.left = Math.max(
                    8,
                    Math.min(event.clientX, innerWidth - width - 8)
                ) + 'px';

                menu.style.top = Math.max(
                    8,
                    Math.min(event.clientY, innerHeight - height - 8)
                ) + 'px';

                menu.querySelector('button')?.focus();
            }, true);

            // 点击其他位置关闭菜单
            document.addEventListener('pointerdown', (event) => {
                if (activeMathCopyMenu &&
                    !activeMathCopyMenu.contains(event.target)) {
                    closeMathCopyMenu();
                }
            }, true);

            // Escape 优先关闭复制菜单，不关闭公式弹窗
            document.addEventListener('keydown', (event) => {
                if (event.key === 'Escape' && activeMathCopyMenu) {
                    event.preventDefault();
                    event.stopImmediatePropagation();
                    closeMathCopyMenu();
                }
            }, true);

            /* 初始化 */

            try {
                const saved = localStorage.getItem('buaa-gpa-studio');
                if (saved) {
                    const restored = parseINI(saved);
                    state.sets = restored.sets;
                    state.precision = restored.precision;
                    // 文件句柄不会随刷新恢复，自动写回 INI 因此保持关闭。
                    state.autosave = false;
                }
            } catch (error) {
                // 本地存储不可用时从空白组开始。
            }
            if (!state.sets.length) state.sets = [{
                name: '全部课程',
                courses: []
            }];
            const precisionSelect = document.getElementById('precision-select');
            for (let i = 0; i <= 7; i++) {
                const option = document.createElement('option');
                option.value = String(i);
                option.textContent = String(i);
                precisionSelect.appendChild(option);
            }
            renderAll();
            updateIniStatus();
            window.addEventListener('pagehide', saveLocalDraft);
        </script>
    </body>

</html>
